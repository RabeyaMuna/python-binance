# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:

- push
- workflow_dispatch
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.9'
    - name: Install Ruff
      # Keep lint results reproducible. New Ruff releases can add preview rules,
      # which previously broke CI without any repository changes.
      run: pip install ruff==0.14.5
    - name: Lint code with Ruff
      run: ruff check --output-format=github --target-version=py39 .
    - name: Check code formatting with Ruff
      run: ruff format --check .
      continue-on-error: true

  test:
    needs: lint
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      max-parallel: 2
      matrix:
        python-version: ['3.9', '3.12']
    env:
      PROXY: ${{ secrets.PROXY }}
      TEST_TESTNET: 'true'
      TEST_API_KEY: ${{ secrets.TEST_API_KEY }}
      TEST_API_SECRET: ${{ secrets.TEST_API_SECRET }}
      TEST_FUTURES_API_KEY: ${{ secrets.TEST_FUTURES_API_KEY }}
      TEST_FUTURES_API_SECRET: ${{ secrets.TEST_FUTURES_API_SECRET }}
    steps:
    - uses: actions/checkout@v5
    - name: Checking env
      run: 'echo "Python version: ${{ matrix.python-version }}"'
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pyright tox
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f test-requirements.txt ]; then pip install -r test-requirements.txt; fi
    - name: Type check with pyright (Python 3.12 only)
      if: matrix.python-version == '3.12'
      run: pyright
    - name: Integration tests with tox
      if: >-
        env.TEST_API_KEY != '' &&
        env.TEST_API_SECRET != '' &&
        env.TEST_FUTURES_API_KEY != '' &&
        env.TEST_FUTURES_API_SECRET != ''
      run: tox -e py
    - name: Coveralls Parallel
      if: >-
        env.TEST_API_KEY != '' &&
        env.TEST_API_SECRET != '' &&
        env.TEST_FUTURES_API_KEY != '' &&
        env.TEST_FUTURES_API_SECRET != ''
      uses: coverallsapp/github-action@v2
      with:
        parallel: true
  finish:
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Coveralls Finished
      uses: coverallsapp/github-action@v2
      with:
        parallel-finished: true
